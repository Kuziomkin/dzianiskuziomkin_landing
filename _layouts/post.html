---
layout: default
---
<style>
    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    .post-header {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px 32px;
    }

    .post-header h1 {
        font-family: 'DM Serif Display', Georgia, serif;
        font-size: clamp(26px, 4vw, 36px);
        font-weight: 400;
        color: var(--text);
        margin: 0 0 12px;
        line-height: 1.2;
    }

    .post-meta {
        font-size: 13px;
        color: var(--text-sec);
        margin-bottom: 12px;
    }

    .post-header .post-desc {
        font-size: 15px;
        color: var(--text-sec);
        line-height: 1.6;
        margin: 0;
    }

    .post-body {
        max-width: 720px;
        margin: 0 auto;
        padding: 0 24px 64px;
        font-size: 15px;
        line-height: 1.7;
        color: var(--text);
    }

    .post-body h2 {
        font-family: 'DM Serif Display', Georgia, serif;
        font-size: 22px;
        font-weight: 400;
        margin: 40px 0 12px;
    }

    .post-body h3 {
        font-size: 16px;
        font-weight: 500;
        margin: 28px 0 8px;
    }

    .post-body p { margin: 0 0 16px; }

    .post-body a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
    }

    .post-body ul, .post-body ol {
        padding-left: 20px;
        margin: 0 0 16px;
    }

    .post-body li { margin-bottom: 6px; }

    .post-body code {
        font-size: 13px;
        background: var(--surface);
        border-radius: 4px;
        padding: 1px 5px;
    }

    .post-body pre {
        background: var(--surface);
        border-radius: 8px;
        padding: 16px;
        overflow-x: auto;
        margin: 0 0 20px;
    }

    .post-body pre code {
        background: none;
        padding: 0;
    }

    .post-wide {
        position: relative;
        left: 50%;
        transform: translateX(-50%);
        width: 100vw;
        max-width: 1340px;
        padding: 32px 48px;
        box-sizing: border-box;
        margin: 32px 0;
        background: var(--surface);
        border-radius: 12px;
    }
</style>

<div class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
    {% if page.description %}
    <p class="post-desc">{{ page.description }}</p>
    {% endif %}
</div>

<div class="post-body">
    {{ content }}
</div>
